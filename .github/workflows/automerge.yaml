name: Auto-Merge PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# gh pr merge needs write access; the default token is often read-only.
permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    runs-on: ubuntu-latest
    # Only run on PRs targeting main
    if: github.base_ref == 'main'
    steps:
      - name: Enable Auto-Merge
        env:
          # Prefer a PAT so the merge commit is not authored by GITHUB_TOKEN.
          # Merges via GITHUB_TOKEN do not trigger other workflows (CI/deploy).
          # Create a fine-grained PAT with Contents + Pull requests write, then
          # add it as repo secret AUTO_MERGE_TOKEN.
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
        # Squash only (the main ruleset allows nothing else). Auto-merge waits for the
        # required checks (cubic · AI code reviewer, CodeQL) and resolved conversations.
        run: |
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash
